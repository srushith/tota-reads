<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tota Reads</title>
<meta name="description" content="Scan a textbook page, tap a line to hear it, and get it explained in simple words.">
<meta name="theme-color" content="#1D2840">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Tammudu+2:wght@500;600&family=Baloo+Thambi+2:wght@500;600&family=Baloo+Tamma+2:wght@500;600&family=Baloo+Chettan+2:wght@500;600&family=Baloo+Da+2:wght@500;600&family=Baloo+Bhai+2:wght@500;600&family=Baloo+Paaji+2:wght@500;600&family=Baloo+Bhaina+2:wght@500;600&family=Noto+Nastaliq+Urdu:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><img src="/icon-192.png" alt="" width="44" height="44"></span>
      <span class="brand-text"><b>Tota Reads</b><small>Read any textbook page aloud</small></span>
    </div>
    <button class="icon-btn" id="gear" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <section class="settings" id="settings" hidden aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <div class="grid3">
      <div class="field">
        <label for="set-grade">Child's class</label>
        <select id="set-grade">
          <option value="1">Class 1</option><option value="2">Class 2</option><option value="3">Class 3</option>
          <option value="4">Class 4</option><option value="5">Class 5</option>
        </select>
      </div>
      <div class="field">
        <label for="set-simplify">Simplify in</label>
        <select id="set-simplify">
          <option value="page">Page language</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="field">
        <label for="set-voice">Voice</label>
        <select id="set-voice">
          <option>Kore</option><option>Aoede</option><option>Leda</option><option>Zephyr</option><option>Puck</option><option>Charon</option>
        </select>
      </div>
    </div>
    <p class="server-state" id="server-state">Checking the connection to Gemini…</p>
    <button class="save" id="save" type="button">Save</button>
  </section>

  <div class="scan-group">
    <label class="scan" id="scan">
      <input id="camera" type="file" accept="image/*" capture="environment">
      <span class="cam" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg></span>
      <span class="label"><b>Scan a page</b><small>Point the camera at a textbook page</small></span>
    </label>
    <label class="pick" id="pick">
      <input id="gallery" type="file" accept="image/*">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
      <span>Or choose a saved photo</span>
    </label>
  </div>

  <div class="bar">
    <div class="source">
      <img class="thumb" id="thumb" alt="Photo of the scanned page" hidden>
      <div class="source-text"><b id="source-title">Sample page</b><small id="source-meta">Telugu · 7 lines</small></div>
    </div>
    <button class="switch" id="slow" type="button" aria-pressed="true">
      <span>Read slowly</span>
      <span class="knob" aria-hidden="true"></span>
    </button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <ol class="lines" id="lines" aria-label="Lines on the page"></ol>

  <p class="foot">Reads the page and speaks with Google Gemini</p>
</div>
</body>
</html>
